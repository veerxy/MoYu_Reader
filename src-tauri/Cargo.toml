[package]
name = "moyu-reader"
version = "1.0.0"
description = "极简隐蔽桌面文档阅读器 (Tauri 版)"
authors = ["moyu"]
edition = "2021"

[lib]
name = "moyu_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
