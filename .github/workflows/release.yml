name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm install
          npm install -D @tailwindcss/oxide-win32-x64-msvc lightningcss-win32-x64-msvc @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Tauri Desktop App (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ACTION_PACKAGE_MANAGER: npm
        with:
          projectPath: '.'
          tagName: v__VERSION__
          releaseName: 'MoYu Reader v__VERSION__'
          releaseBody: |
            极简隐蔽桌面文档阅读器 (Tauri v2 原生桌面端)
            
            - **绿色便携版**：`moyu-reader-portable.exe`（单文件双击即开，免安装）
            - **Windows 安装包**：`moyu-reader_1.0.0_x64-setup.exe` / `.msi`
          releaseDraft: false
          prerelease: false

      - name: Prepare and Release Portable Executable
        if: always()
        shell: pwsh
        run: |
          # 查找构建出的单个可执行独立 exe
          $standaloneExe = "src-tauri/target/release/moyu-reader.exe"
          if (Test-Path $standaloneExe) {
            Write-Host "Found standalone executable: $standaloneExe"
            Copy-Item $standaloneExe -Destination "src-tauri/target/release/moyu-reader-portable.exe"
            Write-Host "Created portable exe: moyu-reader-portable.exe"
            
            # 如果存在 GitHub Release，将绿色单文件直接上传至对应 Release
            $tag = "v1.0.0"
            if ($env:GITHUB_TOKEN) {
              try {
                gh release upload $tag "src-tauri/target/release/moyu-reader-portable.exe" --clobber
                Write-Host "Uploaded portable exe to GitHub Release $tag"
              } catch {
                Write-Warning "Could not upload via gh cli: $_"
              }
            }
          } else {
            Write-Warning "moyu-reader.exe not found in src-tauri/target/release"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows exe and msi Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moyu-reader-windows
          path: |
            src-tauri/target/release/moyu-reader-portable.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/moyu-reader.exe
          if-no-files-found: warn
