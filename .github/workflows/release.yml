name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build

  release:
    needs: ci
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm install
          npm install -D @tailwindcss/oxide-win32-x64-msvc lightningcss-win32-x64-msvc @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Tauri Desktop App (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ACTION_PACKAGE_MANAGER: npm
        with:
          projectPath: '.'
          tagName: v__VERSION__
          releaseName: 'MoYu Reader v__VERSION__'
          releaseBody: |
            极简隐蔽桌面文档阅读器 (Tauri v2 原生桌面端)

            - **PDF 透明背景**：支持移除 PDF 页面自身底色，仅保留文字、图片和图形
            - **绿色便携版**：`moyu-reader-portable.exe`（单文件双击即开，免安装）
            - **Windows 安装包**：NSIS `.exe` / MSI `.msi`

            ## Windows SmartScreen 安全提示

            当前发布包尚未进行商业代码签名。首次运行时，Windows 可能显示 **“Windows 已保护你的电脑”**。

            这是 Windows 对未签名程序的常规提醒，并不代表检测到病毒。如果你确认文件来自本仓库 Releases 页面，可以：

            1. 点击 **“更多信息”**
            2. 点击 **“仍要运行”**

            > 请只对确认来源可信的程序使用此方式。
          releaseDraft: false
          prerelease: false

      - name: Update portable executable release asset
        # 只有 Tauri 构建成功才更新 Release；构建失败时继续上传诊断 artifact。
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tauri Action 的 tagName 是 v__VERSION__，这里必须从应用配置读取同一个版本，
          # 避免手动从 main 触发时把 portable 上传到 main 这个不存在的 Release。
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tag = "v$($config.version)"
          $standaloneExe = "src-tauri/target/release/moyu-reader.exe"

          if (-not (Test-Path $standaloneExe)) {
            throw "Portable source executable not found: $standaloneExe"
          }

          Copy-Item $standaloneExe -Destination "src-tauri/target/release/moyu-reader-portable.exe" -Force
          Write-Host "Created portable executable: moyu-reader-portable.exe"

          # gh 原生命令失败不会自动触发 PowerShell try/catch，必须检查 LASTEXITCODE。
          $success = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Attempting gh release upload to $tag (attempt $i/3)..."
            gh release upload $tag "src-tauri/target/release/moyu-reader-portable.exe" --clobber
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Successfully updated portable executable in GitHub Release $tag"
              break
            }

            Write-Warning "Attempt $i failed with exit code $LASTEXITCODE. Waiting 5 seconds before retry..."
            Start-Sleep -Seconds 5
          }

          if (-not $success) {
            throw "Could not upload portable executable to GitHub Release $tag"
          }

          # 已存在的 Release 不会自动应用 tauri-action 的 releaseBody，
          # 因此每次更新资产时同步覆盖说明，确保 SmartScreen 提示始终可见。
          $releaseNotes = @'
          极简隐蔽桌面文档阅读器 (Tauri v2 原生桌面端)

          - **PDF 透明背景**：支持移除 PDF 页面自身底色，仅保留文字、图片和图形
          - **绿色便携版**：`moyu-reader-portable.exe`（单文件双击即开，免安装）
          - **Windows 安装包**：NSIS `.exe` / MSI `.msi`

          ## Windows SmartScreen 安全提示

          当前发布包尚未进行商业代码签名。首次运行时，Windows 可能显示 **“Windows 已保护你的电脑”**。

          这是 Windows 对未签名程序的常规提醒，并不代表检测到病毒。如果你确认文件来自本仓库 Releases 页面，可以：

          1. 点击 **“更多信息”**
          2. 点击 **“仍要运行”**

          > 请只对确认来源可信的程序使用此方式。
          '@
          gh release edit $tag --notes $releaseNotes
          if ($LASTEXITCODE -ne 0) {
            throw "Could not update release notes for $tag"
          }

      - name: Upload Windows exe and msi Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moyu-reader-windows
          path: |
            src-tauri/target/release/moyu-reader-portable.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/moyu-reader.exe
          if-no-files-found: warn
