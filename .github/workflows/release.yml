name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm install
          npm install -D @tailwindcss/oxide-win32-x64-msvc lightningcss-win32-x64-msvc @rollup/rollup-win32-x64-msvc --no-save

      - name: Build Tauri Desktop App (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ACTION_PACKAGE_MANAGER: npm
        with:
          projectPath: '.'
          tagName: v__VERSION__
          releaseName: 'MoYu Reader v__VERSION__'
          releaseBody: |
            极简隐蔽桌面文档阅读器 (Tauri v2 原生桌面端)
            
            - **绿色便携版**：`moyu-reader-portable.exe`（单文件双击即开，免安装）
            - **Windows 安装包**：`moyu-reader_1.0.1_x64-setup.exe` / `.msi`
          releaseDraft: false
          prerelease: false

      - name: Prepare and Release Portable Executable
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          # 查找构建出的单个可执行独立 exe
          $standaloneExe = "src-tauri/target/release/moyu-reader.exe"
          if (Test-Path $standaloneExe) {
            Write-Host "Found standalone executable: $standaloneExe"
            Copy-Item $standaloneExe -Destination "src-tauri/target/release/moyu-reader-portable.exe"
            Write-Host "Created portable exe: moyu-reader-portable.exe"
            
            # 获取当前 tag 或者 fallback 到 v1.0.1
            $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.1" }
            if ($env:GITHUB_TOKEN) {
              # 添加 3 次网络握手重试，应对 GitHub API 偶发 TLS timeout
              $success = $false
              for ($i = 1; $i -le 3; $i++) {
                try {
                  Write-Host "Attempting gh release upload (attempt $i/3)..."
                  gh release upload $tag "src-tauri/target/release/moyu-reader-portable.exe" --clobber
                  $success = $true
                  Write-Host "Successfully uploaded portable exe to GitHub Release $tag"
                  break
                } catch {
                  Write-Warning "Attempt $i failed: $_. Waiting 5s before retry..."
                  Start-Sleep -Seconds 5
                }
              }
              if (-not $success) {
                Write-Warning "Could not upload via gh cli after 3 attempts, artifact upload step will still preserve the binary."
              }
            }
          } else {
            Write-Warning "moyu-reader.exe not found in src-tauri/target/release"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload Windows exe and msi Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moyu-reader-windows
          path: |
            src-tauri/target/release/moyu-reader-portable.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/moyu-reader.exe
          if-no-files-found: warn
